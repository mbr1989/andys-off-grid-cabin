# Board: Waveshare ESP32-S3-ETH (Waveshare)
# Definition: definitions/boards/waveshare-esp32-s3-eth/manifest.yaml

esphome:
  name: camtest
  friendly_name: CamTest

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "36RO7uQR3Plv9Z25ShAjEEn+0reK7LnqF5n8GGp4HKk="

ota:
  - platform: esphome

ethernet:
  clk_pin: GPIO13
  clock_speed: 25MHz
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  miso_pin: GPIO12
  mosi_pin: GPIO11
  reset_pin: GPIO9
  type: W5500
