# Board: Waveshare ESP32-S3-ETH (Waveshare)
# Definition: definitions/boards/waveshare-esp32-s3-eth/manifest.yaml

esphome:
  name: rack-moni-hs007-hall
  friendly_name: rack-moni-hs007-hall

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret rack_moni_hs007_hall__encryption_key

ota:
  - platform: web_server

ethernet:
  clk_pin: GPIO13
  clock_speed: 25MHz
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  miso_pin: GPIO12
  mosi_pin: GPIO11
  reset_pin: GPIO9
  type: W5500

web_server:
  port: 80
  version: 3
  auth:
    password: !secret rack_moni_hs007_hall__web_password
    username: admin
    type: digest

esp32_camera:
  name: ESPcam
  external_clock:
    pin: GPIO15
    frequency: 12MHz
  # SCCB / I2C Pins
  i2c_pins:
    sda: GPIO48       # Laut Tabelle: SIOD
    scl: GPIO47       # Laut Tabelle: SIOC
  # Parallel-Datenbus [D0, D1, D2, D3, D4, D5, D6, D7]
  data_pins:
    - GPIO41          # D0
    - GPIO45          # D1
    - GPIO46          # D2
    - GPIO42          # D3
    - GPIO40          # D4
    - GPIO38          # D5
    - GPIO15          # D6
    - GPIO18          # D7
  vsync_pin: GPIO01
  href_pin: GPIO02
  pixel_clock_pin: GPIO26
  # Power Management
  reset_pin: GPIO05
  resolution: 1280x1024
  jpeg_quality: 15
  vertical_flip: False

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

sensor:
 - platform: dht
   pin:
   temperature:
     name: Rack Temperature
     icon: "mdi:temperature-celsius"
   humidity:
     name: Rack Humidity
     icon: "mdi:water-percent"
   update_interval: 60s
   model: DHT22