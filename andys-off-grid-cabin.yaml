# Board: LilyGo T3-S3
# Definition: definitions/boards/lilygo-t3-s3/manifest.yaml

substitutions:
  bms_control_params_skip_updates: "20"   # 20 - update every 20th update cycle

esphome:
  name: andys-off-grid-cabin
  friendly_name: "Andy's Off-Grid Cabin"
  area: Off-Grid Cabin

esp32:
  variant: esp32s3
  framework:
    type: arduino

logger:
  hardware_uart: USB_SERIAL_JTAG
  # Nutzt den internen S3 USB-Port anstelle von UART0

web_server:
  port: 80
  version: 3
  auth:
    username: andy
    password: !secret andys_off_grid_cabin__web_password
    type: digest

api:
  encryption:
    key: !secret andys_off_grid_cabin__encryption_key

globals:
  - id: victron_is_off
    type: bool
    initial_value: 'false'

packages:
  display: !include packages/display.yaml
  external_components: !include packages/external-components.yaml
  ip_plus: !include packages/ip-plus.yaml
  jk_bms: !include packages/jk-bms.yaml
  lorawan: !include packages/lorawan.yaml
  lorawan_payload_bindings: !include packages/lorawan-payload-bindings.yaml
  modbus_components: !include packages/modbus-components.yaml
  modbus_controllers: !include packages/modbus-controllers.yaml
  tracer_rated_datum: !include packages/tracer-rated-datum.yaml
  tracer_real_time: !include packages/tracer-real-time.yaml
  tracer_settings: !include packages/tracer-settings.yaml
  tracer_stats: !include packages/tracer-stats.yaml
  uarts: !include packages/uarts.yaml
  victron: !include packages/victron.yaml
  wifi: !include packages/wifi.yaml
  
# ----------------------------------------------------------------------
# Sensors & Devices
# ----------------------------------------------------------------------
sensor:
  - platform: template
    accuracy_decimals: 0
    name: "MPPT Generated Charge today"
    id: mppt_generated_charge_today
    unit_of_measurement: "Ah"
  - platform: template
    id: intrusion_detection_numeric
    name: "Intrusion Detection Numeric"
    accuracy_decimals: 0
    lambda: |-
      if (id(intrusion_detection).state) {
        return 1.0;
      } else {
        return 0.0;
      }
# ----------------------------------------------------------------------
# EPEver Modbus Settings: SOC Management & Charging Percentage
# ----------------------------------------------------------------------

switch:
  # Modus umschalten: OFF = Spannungssteuerung (0), ON = SOC-Steuerung (1)
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    name: "EPEver Management Mode (SOC)"
    id: epever_management_mode_soc
    address: 0x9070
    register_type: holding

number:
  # Lade-Limit in % (0 - 100%)
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    name: "EPEver Charging Limit (%)"
    id: epever_charging_limit_pct
    address: 0x906E
    register_type: holding
    value_type: U_WORD
    multiply: 100
    min_value: 0
    max_value: 100
    step: 5
 
# ----------------------------------------------------------------------
# Fridge SoC control
# ----------------------------------------------------------------------

interval:
  - interval: 5s
    then:
      - lambda: !lambda |-
          if (!isnan(id(jkbms_battery_soc).state)) {
            float soc = id(jkbms_battery_soc).state;
            
            // 1. ABSCHALTEN: SoC fällt unter 50%
            if (soc < 50.0 && !id(victron_is_off).value) {
              ESP_LOGW("main", "JK-BMS SoC unter 50%% (Aktuell: %.1f%%) - Sende VE.Direct HEX an uart_victron: Inverter AUS!", soc);
              
              // Frame schaltet Register 0x0200 auf Mode 1 (Off)
              id(uart_victron).write_str(":70002000100F2\n");
              id(victron_is_off).value = true;
            }
            
            // 2. WIEDEREINSCHALTEN: SoC steigt wieder auf >= 70% (Hysterese)
            else if (soc >= 70.0 && id(victron_is_off).value) {
              ESP_LOGI("main", "JK-BMS SoC erholt (>= 70%%: %.1f%%) - Sende VE.Direct HEX an uart_victron: Inverter EIN!", soc);
              
              // Frame schaltet Register 0x0200 auf Mode 3 (On)
              id(uart_victron).write_str(":70002000300F0\n");
              id(victron_is_off).value = false;
            }
          }
    startup_delay: 0s
    
# ----------------------------------------------------------------------
# Use Solar Power
# ----------------------------------------------------------------------
  
  - interval: 20s
    then:
      - if:
          condition:
            and:
              # 1. PV-Eingangsspannung prüfen (> 35 V)
              - lambda: !lambda |-
                  return !isnan(id(mppt_pv_input_voltage).state) && id(mppt_pv_input_voltage).state > 35.0;

              # 2. Entladestrom am JK-BMS prüfen (Strom ist negativ beim Entladen, z. B. < -2.0 A)
              - lambda: !lambda |-
                  return !isnan(id(current).state) && id(current).state < -2.0;

              # 3. Ladestrom am EPEver prüfen (EPEver hängt fest bei < 0.5 A)
              - lambda: !lambda |-
                  return !isnan(id(mppt_charging_current).state) && id(mppt_charging_current).state < 0.5;
          then:
            - script.execute: force_mppt_reconnect

# ----------------------------------------------------------------------
# Intrusion Detection
# ----------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: intrusion_detection
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true
    name: Einbrucherkennung
    icon: "mdi:alarm-light"