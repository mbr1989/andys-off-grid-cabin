# Board: LilyGo T3-S3
# Definition: definitions/boards/lilygo-t3-s3/manifest.yaml

esphome:
  name: andys-off-grid-cabin
  friendly_name: "Andy's Off-Grid Cabin"
  area: Off-Grid Cabin

esp32:
  variant: esp32s3
  framework:
    type: arduino

logger:
  hardware_uart: USB_SERIAL_JTAG
  # Nutzt den internen S3 USB-Port anstelle von UART0

web_server:
  port: 80
  version: 3
  auth:
    username: andy
    password: !secret andys_off_grid_cabin__web_password
    type: digest

api:
  encryption:
    key: !secret andys_off_grid_cabin__encryption_key

globals:
  - id: victron_is_off
    type: bool
    initial_value: 'false'
  - id: fridge_cutoff_soc
    type: float
    initial_value: '50.0' # Default 50% Abschaltgrenze
  - id: fridge_restore_soc
    type: float
    initial_value: '70.0' # Default 70% Wiedereinschaltung
  - id: coming_home_active
    type: bool
    initial_value: 'false'
  - id: leaving_home_active
    type: bool
    initial_value: 'false'

packages:
  display: !include packages/display.yaml
  external_components: !include packages/external-components.yaml
  ip_plus: !include packages/ip-plus.yaml
  jk_bms: !include packages/jk-bms.yaml
  lorawan: !include packages/lorawan.yaml
  lorawan_payload_bindings: !include packages/lorawan-payload-bindings.yaml
  modbus_components: !include packages/modbus-components.yaml
  modbus_controllers: !include packages/modbus-controllers.yaml
  tracer_rated_datum: !include packages/tracer-rated-datum.yaml
  tracer_real_time: !include packages/tracer-real-time.yaml
  tracer_settings: !include packages/tracer-settings.yaml
  tracer_stats: !include packages/tracer-stats.yaml
  uarts: !include packages/uarts.yaml
  victron: !include packages/victron.yaml
  wifi: !include packages/wifi.yaml
  #sd_card: !include packages/sd-card.yaml
  
# ----------------------------------------------------------------------
# Sensors & Devices
# ----------------------------------------------------------------------
sensor:
  - platform: template
    accuracy_decimals: 0
    name: "MPPT Generated Charge today"
    id: mppt_generated_charge_today
    unit_of_measurement: "Ah"
  - platform: template
    id: intrusion_detection_numeric
    name: "Intrusion Detection Numeric"
    accuracy_decimals: 0
    lambda: |-
      if (id(intrusion_detection).state) {
        return 1.0;
      } else {
        return 0.0;
      }
# ----------------------------------------------------------------------
# EPEver Modbus Settings: SOC Management & Charging Percentage
# ----------------------------------------------------------------------

switch:
  # Modus umschalten: OFF = Spannungssteuerung (0), ON = SOC-Steuerung (1)
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    name: "EPEver Management Mode (SOC)"
    id: epever_management_mode_soc
    address: 0x9070
    register_type: holding

number:
  # Lade-Limit in % (0 - 100%)
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    name: "EPEver Charging Limit (%)"
    id: epever_charging_limit_pct
    address: 0x906E
    register_type: holding
    value_type: U_WORD
    multiply: 100
    min_value: 0
    max_value: 100
    step: 5
 
# ----------------------------------------------------------------------
# Fridge SoC control
# ----------------------------------------------------------------------

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(jkbms_batt_soc).has_state()) {
            float soc = id(jkbms_batt_soc).state;
            float cutoff = id(fridge_cutoff_soc);
            float restore = id(fridge_restore_soc);

            // Abschalten bei Unterschreiten des Cutoff-SoC
            if (soc < cutoff && !id(victron_is_off)) {
              ESP_LOGI("fridge_ctrl", "SoC unter Cutoff (%.0f%%) - Victron deaktiviert", cutoff);
              id(victron_is_off) = true;
            } 
            // Einschalten bei Erreichen des Restore-SoC
            else if (soc >= restore && id(victron_is_off)) {
              ESP_LOGI("fridge_ctrl", "SoC ausreichend (>= %.0f%%) - Victron freigegeben", restore);
              id(victron_is_off) = false;
            }
          }
    startup_delay: 0s
    
# ----------------------------------------------------------------------
# Use Solar Power
# ----------------------------------------------------------------------
  
  - interval: 20s
    then:
      - if:
          condition:
            and:
              # 1. PV-Eingangsspannung prüfen (> 35 V)
              - lambda: !lambda |-
                  return !isnan(id(mppt_pv_input_voltage).state) && id(mppt_pv_input_voltage).state > 35.0;

              # 2. Entladestrom am JK-BMS prüfen (Strom ist negativ beim Entladen, z. B. < -2.0 A)
              - lambda: !lambda |-
                  return !isnan(id(jkbms_curr_batt).state) && id(jkbms_curr_batt).state < -2.0;

              # 3. Ladestrom am EPEver prüfen (EPEver hängt fest bei < 0.5 A)
              - lambda: !lambda |-
                  return !isnan(id(mppt_charging_current).state) && id(mppt_charging_current).state < 0.5;
          then:
            - script.execute: force_mppt_reconnect

# ----------------------------------------------------------------------
# Intrusion Detection
# ----------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: intrusion_detection
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true
    name: Einbrucherkennung
    icon: "mdi:alarm-light"
    
script:
  # --------------------------------------------------------------------
  # COMING HOME (Fernstart per LoRaWAN auf Port 2)
  # --------------------------------------------------------------------
  - id: trigger_coming_home
    then:
      - lambda: |-
          // Prüfe Status Bit D0 aus Register 0x3202
          if (id(ip_plus_status_bitmask).has_state()) {
            uint16_t status_mask = (uint16_t)id(ip_plus_status_bitmask).state;
            bool is_running = (status_mask & 0x0001) != 0;

            if (is_running) {
              ESP_LOGI("coming_home", "IP-Plus läuft bereits vor Ort (D0=1). Remote-Start ignoriert.");
              return;
            }
          }

          ESP_LOGI("coming_home", "Coming Home gestartet! Schalte IP-Plus auf Remote & EIN...");
          id(coming_home_active) = true;

          // 1. Umschalten von Lokal auf Remote (0x0011)
          id(ip_plus_remote_mode).turn_on();
          // 2. Inverter Ausgang aktivieren (0x000F)
          id(ip_plus_output_enable).turn_on();

      - delay: 30min # Gewünschte Coming-Home-Dauer

      - lambda: |-
          ESP_LOGI("coming_home", "Coming Home beendet. Gehe zurück in Local-Modus...");
          // Inverter-Ausgang ausschalten & zurück auf Local setzen
          id(ip_plus_output_enable).turn_off();
          id(ip_plus_remote_mode).turn_off();
          id(coming_home_active) = false;

  # --------------------------------------------------------------------
  # LEAVING HOME (Ausschalten vor Ort erkannt -> 5s Pause + 30 Min Nachlauf)
  # --------------------------------------------------------------------
  - id: trigger_leaving_home
    then:
      - logger.log: "Vor-Ort Schalter AUS erkannt! Leaving Home startet in 5 Sekunden..."
      - delay: 5s

      - lambda: |-
          ESP_LOGI("leaving_home", "Leaving Home aktiv! Starte Nachlauf...");
          id(leaving_home_active) = true;

          // 1. Remote Mode aktivieren
          id(ip_plus_remote_mode).turn_on();
          // 2. Inverter für Nachlauf einschalten
          id(ip_plus_output_enable).turn_on();

      - delay: 30min # Gewünschte Nachlauf-Dauer

      - lambda: |-
          ESP_LOGI("leaving_home", "Leaving Home Nachlauf beendet. Schalte IP-Plus sauber AUS...");
          // Inverter ausschalten & zurück in den Local-Modus übergeben
          id(ip_plus_output_enable).turn_off();
          id(ip_plus_remote_mode).turn_off();
          id(leaving_home_active) = false;