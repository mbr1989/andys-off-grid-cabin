spi:
  - id: sd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO11
    miso_pin: GPIO02

# Globale Variable zur Verfolgung des SD-Karten-Status
globals:
  - id: sd_card_mounted
    type: bool
    initial_value: 'false'

# Initialisierung der SD-Karte beim Start
esphome:
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          #include "SD.h"
          #include "SPI.h"
          
          // Nutze den definierten SPI-Bus für die SD-Karte
          SPIClass sd_spi_bus(FSPI); // Verwende FSPI/HSPI Hardware-Bus
          sd_spi_bus.begin(14, 2, 11, 13); // SCK=14, MISO=2, MOSI=11, SS/CS=13
          
          if (SD.begin(13, sd_spi_bus)) {
            id(sd_card_mounted) = true;
            ESP_LOGI("sd_card", "SD-Karte erfolgreich initialisiert!");
          } else {
            id(sd_card_mounted) = false;
            ESP_LOGE("sd_card", "SD-Karte konnte nicht initialisiert werden!");
          }

interval:
  # -------------------------------------------------------------
  # 1. JK-BMS Logging (Intervall: alle 10 Sekunden)
  # -------------------------------------------------------------
  - interval: 10s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/jk_bms.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;SOC;Total_Voltage;Current;Delta_Cell_Voltage;Power;Capacity_Remaining\n", f);
              }

              float soc  = id(jk_bms_state_of_charge).has_state() ? id(jk_bms_state_of_charge).state : 0.0;
              float v    = id(jk_bms_total_voltage).has_state() ? id(jk_bms_total_voltage).state : 0.0;
              float a    = id(jk_bms_current).has_state() ? id(jk_bms_current).state : 0.0;
              float dev  = id(jk_bms_delta_cell_voltage).has_state() ? id(jk_bms_delta_cell_voltage).state : 0.0;
              float p    = id(jk_bms_power).has_state() ? id(jk_bms_power).state : 0.0;
              float cap  = id(jk_bms_capacity_remaining).has_state() ? id(jk_bms_capacity_remaining).state : 0.0;

              fprintf(f, "%lu;%.1f;%.2f;%.2f;%.3f;%.1f;%.2f\n",
                      millis(), soc, v, a, dev, p, cap);

              fclose(f);
            }
          }

  # -------------------------------------------------------------
  # 2. EPever Tracer MPPT Logging (Intervall: alle 30 Sekunden)
  # -------------------------------------------------------------
  - interval: 30s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/tracer.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;PV_Voltage;PV_Current;PV_Power;Battery_Voltage;Charging_Current;Charging_Power\n", f);
              }

              float pv_v  = id(mppt_pv_voltage).has_state() ? id(mppt_pv_voltage).state : 0.0;
              float pv_a  = id(mppt_pv_current).has_state() ? id(mppt_pv_current).state : 0.0;
              float pv_w  = id(mppt_pv_power).has_state() ? id(mppt_pv_power).state : 0.0;
              float bat_v = id(mppt_battery_voltage).has_state() ? id(mppt_battery_voltage).state : 0.0;
              float chg_a = id(mppt_charging_current).has_state() ? id(mppt_charging_current).state : 0.0;
              float chg_w = id(mppt_charging_power).has_state() ? id(mppt_charging_power).state : 0.0;

              fprintf(f, "%lu;%.2f;%.2f;%.1f;%.2f;%.2f;%.1f\n",
                      millis(), pv_v, pv_a, pv_w, bat_v, chg_a, chg_w);

              fclose(f);
            }
          }

  # -------------------------------------------------------------
  # 3. EPever IP-Plus Wechselrichter Logging (Intervall: alle 10 Sekunden)
  # -------------------------------------------------------------
  - interval: 10s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/ip_plus.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;DC_Input_Volt;AC_Output_Volt;AC_Active_Power;Equipment_Status\n", f);
              }

              float dc_v = id(ip_plus_dc_input_voltage).has_state() ? id(ip_plus_dc_input_voltage).state : 0.0;
              float ac_v = id(ip_plus_ac_output_voltage).has_state() ? id(ip_plus_ac_output_voltage).state : 0.0;
              float ac_p = id(ip_plus_ac_output_active_power).has_state() ? id(ip_plus_ac_output_active_power).state : 0.0;
              float st   = id(ip_plus_equipment_status).has_state() ? id(ip_plus_equipment_status).state : 0.0;

              fprintf(f, "%lu;%.2f;%.1f;%.1f;%.0f\n",
                      millis(), dc_v, ac_v, ac_p, st);

              fclose(f);
            }
          }

  # -------------------------------------------------------------
  # 4. Victron VE.Direct Logging (Intervall: alle 30 Sekunden)
  # -------------------------------------------------------------
  - interval: 30s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/victron.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;Panel_Power;Panel_Voltage;Battery_Voltage;Battery_Current\n", f);
              }

              float p_w   = id(victron_panel_power).has_state() ? id(victron_panel_power).state : 0.0;
              float p_v   = id(victron_panel_voltage).has_state() ? id(victron_panel_voltage).state : 0.0;
              float bat_v = id(victron_battery_voltage).has_state() ? id(victron_battery_voltage).state : 0.0;
              float bat_a = id(victron_battery_current).has_state() ? id(victron_battery_current).state : 0.0;

              fprintf(f, "%lu;%.1f;%.2f;%.2f;%.2f\n",
                      millis(), p_w, p_v, bat_v, bat_a);

              fclose(f);
            }
          }