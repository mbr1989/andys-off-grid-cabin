spi:
  - id: sd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO11
    miso_pin: GPIO02

globals:
  - id: sd_card_mounted
    type: bool
    initial_value: 'false'

esphome:
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          #include "SD.h"
          #include "SPI.h"
          
          SPIClass sd_spi_bus(FSPI);
          sd_spi_bus.begin(14, 2, 11, 13);
          
          if (SD.begin(13, sd_spi_bus)) {
            id(sd_card_mounted) = true;
            ESP_LOGI("sd_card", "SD-Karte erfolgreich initialisiert!");
          } else {
            id(sd_card_mounted) = false;
            ESP_LOGE("sd_card", "SD-Karte konnte nicht initialisiert werden!");
          }

interval:
  # -------------------------------------------------------------
  # 1. EPever IP-Plus Wechselrichter Logging (alle 10s)
  # -------------------------------------------------------------
  - interval: 10s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/ip_plus.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;DC_Input_Volt;AC_Output_Volt;AC_Active_Power;Equipment_Status\n", f);
              }

              float dc_v = id(ip_plus_input_voltage).has_state() ? id(ip_plus_dc_input_voltage).state : 0.0;
              float ac_v = id(ip_plus_output_voltage).has_state() ? id(ip_plus_ac_output_voltage).state : 0.0;
              float ac_p = id(ip_plus_output_active_power).has_state() ? id(ip_plus_ac_output_active_power).state : 0.0;
              float st   = id(ip_plus_equipment_status).has_state() ? id(ip_plus_equipment_status).state : 0.0;

              fprintf(f, "%lu;%.2f;%.1f;%.1f;%.0f\n",
                      millis(), dc_v, ac_v, ac_p, st);

              fclose(f);
            }
          }

  # -------------------------------------------------------------
  # 2. EPever Tracer MPPT Logging (alle 30s)
  # -------------------------------------------------------------
  - interval: 30s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/tracer.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;PV_Voltage;PV_Current;PV_Power;Battery_Voltage;Charging_Current;Charging_Power\n", f);
              }

              float pv_v  = id(pv_array_input_voltage).has_state() ? id(pv_array_input_voltage).state : 0.0;
              float pv_a  = id(pv_array_input_current).has_state() ? id(pv_array_input_current).state : 0.0;
              float pv_w  = id(pv_array_input_power).has_state() ? id(pv_array_input_power).state : 0.0;
              float bat_v = id(charging_equipment_output_voltage).has_state() ? id(charging_equipment_output_voltage).state : 0.0;
              float chg_a = id(charging_equipment_output_current).has_state() ? id(charging_equipment_output_current).state : 0.0;
              float chg_w = id(charging_equipment_output_power).has_state() ? id(charging_equipment_output_power).state : 0.0;

              fprintf(f, "%lu;%.2f;%.2f;%.1f;%.2f;%.2f;%.1f\n",
                      millis(), pv_v, pv_a, pv_w, bat_v, chg_a, chg_w);

              fclose(f);
            }
          }

  # -------------------------------------------------------------
  # 3. Victron VE.Direct Logging (alle 30s)
  # Dynamic DC/AC Inverter Logging
  # -------------------------------------------------------------
  - interval: 30s
    then:
      - lambda: |-
          if (id(sd_card_mounted)) {
            FILE *f = fopen("/sdcard/victron.csv", "a");
            if (f != nullptr) {
              fseek(f, 0, SEEK_END);
              if (ftell(f) == 0) {
                fputs("Timestamp_ms;Battery_Voltage;Battery_Current;AC_Output_Voltage;AC_Output_Current;AC_Apparent_Power\n", f);
              }

              float bat_v = id(victron_battery_voltage).has_state() ? id(victron_battery_voltage).state : 0.0;
              float bat_a = id(victron_battery_current).has_state() ? id(victron_battery_current).state : 0.0;
              float ac_v  = id(victron_ac_out_voltage).has_state() ? id(victron_ac_out_voltage).state : 0.0;
              float ac_a  = id(victron_ac_out_current).has_state() ? id(victron_ac_out_current).state : 0.0;
              float ac_s  = id(victron_ac_out_apparent_power).has_state() ? id(victron_ac_out_apparent_power).state : 0.0;

              fprintf(f, "%lu;%.2f;%.2f;%.1f;%.2f;%.1f\n",
                      millis(), bat_v, bat_a, ac_v, ac_a, ac_s);

              fclose(f);
            }
          }