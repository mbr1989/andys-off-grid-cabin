sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_type
    address: 0x9000
    name: "MPPT Battery Type"
    register_type: holding
    value_type: U_WORD
    skip_updates: 50

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_capacity
    address: 0x9001
    name: "MPPT Battery Capacity"
    register_type: holding
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_temperature_compensation_coefficient
    address: 0x9002
    name: "MPPT Temperature compensation coefficient"
    unit_of_measurement: "mV/°C/2V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_high_voltage_disconnect
    address: 0x9003
    name: "MPPT High Voltage disconnect"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_charging_limit_voltage
    address: 0x9004
    name: "MPPT Charging limit voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_over_voltage_reconnect
    address: 0x9005
    name: "MPPT Over voltage reconnect"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_equalization_voltage
    address: 0x9006
    name: "MPPT Equalization voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_boost_voltage
    address: 0x9007
    name: "MPPT Boost voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_float_voltage
    address: 0x9008
    name: "MPPT Float voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_boost_reconnect_voltage
    address: 0x9009
    name: "MPPT Boost reconnect voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_low_voltage_reconnect
    address: 0x900A
    name: "MPPT Low voltage reconnect"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_under_voltage_recover
    address: 0x900B
    name: "MPPT Under voltage recover"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_under_voltage_warning
    address: 0x900C
    name: "MPPT Under voltage warning"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_low_voltage_disconnect
    address: 0x900D
    name: "MPPT Low voltage disconnect"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_discharging_limit_voltage
    address: 0x900E
    name: "Discharging limit voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_temperature_warning_upper_limit
    address: 0x9017
    name: "MPPT Battery temperature warning upper limit"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    # new range add 'skip_updates' again
    skip_updates: 50
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_temperature_warning_lower_limit
    address: 0x9018
    name: "MPPT Battery temperature warning lower limit"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_controller_inner_temperature_upper_limit
    address: 0x9019
    name: "MPPT Controller inner temperature upper limit"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_controller_inner_temperature_upper_limit_recover
    address: 0x901A
    name: "MPPT_Controller inner temperature upper limit recover"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_power_component_temperature_upper_limit
    address: 0x901B
    name: "MPPT Power component temperature upper limit"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_power_component_temperature_upper_limit_recover
    address: 0x901C
    name: "MPPT Power component temperature upper limit recover"
    unit_of_measurement: "°C"
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_line_impedance
    address: 0x901D
    name: "MPPT Line Impedance"
    unit_of_measurement: "mOhm"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_dttv
    address: 0x901E
    name: "MPPT Day Time Threshold Voltage"
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_light_signal_startup_delay_time
    address: 0x901F
    name: "MPPT Light signal startup delay time"
    unit_of_measurement: "mins"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_nttv
    address: 0x9020
    name: "MPPT Light Time Threshold Voltage"
    unit_of_measurement: "mins"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_light_signal_close_delay_time
    address: 0x9021
    name: "MPPT Light signal close delay time"
    unit_of_measurement: "mins"
    register_type: holding
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id:
      mppt_load_controlling_modes
      # 0000H Manual Control
      # 0001H Light ON/OFF
      # 0002H Light ON+ Timer/
      # 0003H Time Control
    address: 0x903D
    name: "MPPT Load controlling modes"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD
    skip_updates: 50

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_working_time_length_1
    # The length of load output timer1,
    # D15-D8,hour, D7-D0, minute
    address: 0x903E
    name: "MPPT Working_time length 1"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_working_time_length_2
    address: 0x903F
    name: "MPPT Working_time length 2"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_1_seconds
    address: 0x9042
    name: "MPPT Turn on timing 1 seconds"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD
    skip_updates: 50

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_1_minutes
    address: 0x9043
    name: "MPPT Turn on timing 1 minutes"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_1_hours
    address: 0x9044
    name: "MPPT Turn on timing 1 hours"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_1_seconds
    address: 0x9045
    name: "MPPT Turn off timing 1 seconds"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_1_minutes
    address: 0x9046
    name: "Turn off timing 1 minutes"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_1_hours
    address: 0x9047
    name: "MPPT Turn off timing 1 hours"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_2_seconds
    address: 0x9048
    name: "MPPT Turn on timing 2 seconds"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_2_minutes
    address: 0x9049
    name: "MPPT Turn on timing 2 minutes"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_on_timing_2_hours
    address: 0x904A
    name: "MPPT Turn on timing 2 hours"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_2_seconds
    address: 0x904B
    name: "MPPT Turn off timing 2 seconds"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_2_minutes
    address: 0x904C
    name: "MPPT Turn off timing 2 minutes"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_turn_off_timing_2_hours
    address: 0x904D
    name: "MPPT Turn off timing 2 hours"
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_backlight_time
    address: 0x9063
    name: "MPPT Backlight time"
    register_type: holding
    accuracy_decimals: 0
    unit_of_measurement: "s"
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_length_of_night_minutes
    address: 0x9065
    internal: true
    bitmask: 0xFF
    unit_of_measurement: "m"
    name: "MPPT_Length of night-mins"
    register_type: holding
    value_type: U_WORD
    filters:
      - lambda: |-
          // x sauber in Integer wandeln vor dem Bitshift
          uint32_t raw_val = static_cast<uint32_t>(x);
          return id(mppt_length_of_night_minutes).state + static_cast<float>(60 * (raw_val >> 8));

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_length_of_night
    address: 0x9065
    bitmask: 0xFF00
    unit_of_measurement: "m"
    name: "MPPT Length of night"
    register_type: holding
    value_type: U_WORD
    skip_updates: 50
    filters:
      - lambda: |-
          return static_cast<float>(id(mppt_length_of_night_minutes).state) + (60.0f * x);

number:
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    name: "MPPT Low Voltage Reconnect Set"
    id: mppt_lvr_set
    address: 0x900A
    value_type: U_WORD
    multiply: 0.01

script:
  - id: force_mppt_reconnect
    then:
      - logger.log: "Wechselrichter zieht Strom - zwinge EPEver Tracer per BVR-Kick in den Boost-Modus"
      # Verwendet jetzt die 'number'-Entität 'mppt_lvr_set' statt des Sensors
      - number.set:
          id: mppt_lvr_set
          value: 27.0
      - delay: 3s
      - number.set:
          id: mppt_lvr_set
          value: 26.7