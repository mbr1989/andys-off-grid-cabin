# ----------------------------------------------------------------------
# LoRaWAN Configuration (SX1262 Chip on LilyGO T3-S3)
# ----------------------------------------------------------------------
lorawan:
  id: my_lorawan
  region: EU868
  sub_band: 0
  uplink_interval: 15min
  # TTN-Credentials (HEX Format via secrets.yaml):
  dev_eui: !secret andys_off_grid_cabin__dev_eui
  join_eui: "0000000000000000"
  app_key: !secret andys_off_grid_cabin__app_key
  
  radio:
    chip: sx1262
    cs_pin: GPIO7
    rst_pin: GPIO8
    busy_pin: GPIO34
    dio1_pin: GPIO33
    sck_pin: GPIO5
    miso_pin:
      number: GPIO3
      ignore_strapping_warning: true
    mosi_pin: GPIO6
    tcxo_voltage: 1.6
    dio2_as_rf_switch: true

  # Downlink-Handler für dynamische SoC-Grenzwerte (Port 1, 2 Bytes)
  on_downlink:
    then:
      - lambda: |-
          // PORT 1: SoC-Grenzwerte anpassen (Byte 0 = Cutoff, Byte 1 = Restore)
          if (port == 1 && payload.size() >= 2) {
            uint8_t new_cutoff = payload[0];
            uint8_t new_restore = payload[1];

            if (new_cutoff >= 10 && new_restore <= 95 && new_restore >= (new_cutoff + 5)) {
              id(fridge_cutoff_soc) = (float)new_cutoff;
              id(fridge_restore_soc) = (float)new_restore;
              ESP_LOGI("lorawan_downlink", "SoC-Grenzwerte angepasst: AUS=%d%%, AN=%d%%", new_cutoff, new_restore);
            }
          }
          
          // PORT 2: Coming Home Fernstart anfordern (1 Byte Payload, z.B. 0x01)
          else if (port == 2 && payload.size() >= 1) {
            if (payload[0] == 0x01) {
              ESP_LOGI("lorawan_downlink", "Coming Home Impuls per LoRaWAN empfangen!");
              id(trigger_coming_home).execute();
            }
          }