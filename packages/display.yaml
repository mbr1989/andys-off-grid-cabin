# ----------------------------------------------------------------------
# Display Configuration (I2C OLED Display)
# Repository: mbr1989/andys-off-grid-cabin
# ----------------------------------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_large
    size: 14

i2c:
  - id: i2c_1
    scl: GPIO17
    sda: GPIO18

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: i2c_1
    id: oled_display
    pages:
      # ----------------------------------------------------------------
      # SEITE 1: Vollständiger Leistungsfluss (Tracer, JK-BMS, IP-Plus, Victron)
      # ----------------------------------------------------------------
      - id: page_power_flow
        lambda: |-
          it.printf(0, 0, id(font_large), "LEISTUNGSFLUSS");
          it.line(0, 15, 128, 15);

          // 1. PV Ertrag (tracer-real-time.yaml)
          float pv_pwr = !isnan(id(mppt_pv_input_power).state) ? id(mppt_pv_input_power).state : 0.0;
          it.printf(0, 17, id(font_small), "PV Ertrag:");
          it.printf(128, 17, id(font_small), TextAlign::TOP_RIGHT, "%.0f W", pv_pwr);

          // 2. Akku Netto-Leistung (jk-bms.yaml)
          float bms_pwr = !isnan(id(jkbms_power).state) ? id(jkbms_power).state : 0.0;
          it.printf(0, 28, id(font_small), "Akku Netto:");
          it.printf(128, 28, id(font_small), TextAlign::TOP_RIGHT, "%.0f W", bms_pwr);

          // 3. EPEver IP-Plus Inverter (ip-plus.yaml)
          float ip_pwr = !isnan(id(ip_plus_output_power).state) ? id(ip_plus_output_power).state : 0.0;
          it.printf(0, 39, id(font_small), "230 Volt Netz:");
          it.printf(128, 39, id(font_small), TextAlign::TOP_RIGHT, "%.0f W", ip_pwr);

          // 4. Victron Phoenix Inverter (Embraco EMD20CLT Korrektur: cos phi ~ 0.90)
          float vic_va = !isnan(id(victron_ac_out_apparent_power).state) ? id(victron_ac_out_apparent_power).state : 0.0;
          float vic_pwr = (vic_va >= 18.0f) ? (vic_va * 0.90f) : 0.0f;
          it.printf(0, 50, id(font_small), "Kühlschrank");
          it.printf(128, 50, id(font_small), TextAlign::TOP_RIGHT, "%.0f W", vic_pwr);

      # ----------------------------------------------------------------
      # SEITE 2: Kühlschrank Status
      # ----------------------------------------------------------------
      - id: page_fridge
        lambda: |-
          it.printf(0, 0, id(font_large), "KUEHLSCHRANK");
          it.line(0, 15, 128, 15);

          if (id(victron_is_off)) {
            it.printf(0, 24, id(font_large), "GESPERRT");
            it.printf(0, 44, id(font_small), "Victron Inverter AUS");
          } else {
            it.printf(0, 24, id(font_large), "FREIGEGEBEN");
            it.printf(0, 44, id(font_small), "Victron Inverter AN");
          }

interval:
  - interval: 6s
    then:
      - display.page.show_next: oled_display