sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_array_rated_voltage
    name: "MPPT Array rated voltage"
    address: 0x3000
    skip_updates: 60
    unit_of_measurement: "V"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
        - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_array_rated_current
    name: "MPPT Array rated current"
    address: 0x3001
    unit_of_measurement: "A"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
        - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_array_rated_power
    name: "MPPT Array rated power"
    address: 0x3002
    register_count: 2
    unit_of_measurement: "W"
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_rated_voltage
    name: "MPPT Battery rated voltage"
    address: 0x3004
    unit_of_measurement: "V"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_rated_current
    name: "MPPT Battery rated current"
    address: 0x3005
    unit_of_measurement: "A"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_battery_rated_power
    name: "MPPT Battery rated power"
    address: 0x3006
    unit_of_measurement: "W"
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_charging_mode
    name: "MPPT Charging mode"
    address: 0x3008
    unit_of_measurement: ""
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_ctl_epever_tracer
    id: mppt_rated_current_of_load
    name: "MPPT Rated current of load"
    address: 0x300E
    skip_updates: 60
    unit_of_measurement: "A"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.01