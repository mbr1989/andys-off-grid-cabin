# --- Victron Phoenix 24/800 ---
sensor:
  - platform: victron
    victron_id: victron_phoenix
    battery_voltage:
      name: "Victron Phoenix Battery Voltage"
      id: victron_battery_voltage
    device_mode_id:
      name: "Victron Phoenix Device Mode ID"
      id: victron_device_mode_id
    ac_out_voltage:
      name: "Victron Phoenix AC OUT Voltage"
      id: victron_ac_out_voltage
    ac_out_current:
      name: "Victron Phoenix AC OUT Current"
      id: victron_ac_out_current
    ac_out_apparent_power:
      name: "Victron Phoenix AC OUT Apparent Power"
