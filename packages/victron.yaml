      name: "Victron Phoenix Firmware Version"
    device_type:
      name: "Victron Phoenix Device Type"
    serial_number:
      name: "Victron Phoenix Serial Number"
    device_mode:
      name: "Victron Phoenix Device Mode"
    warning:
      name: "Victron Phoenix Warning"
